<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Starlight Bottle · Midnight Ocean</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #02040a; }
  #scene { position: fixed; inset: 0; display: block; }
  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 6, 0.6) 100%);
  }
  .ui {
    position: fixed; left: 30px; bottom: 26px; pointer-events: none; user-select: none;
    font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    text-shadow: 0 2px 14px rgba(0, 0, 0, 0.85);
  }
  .ui h1 { font-size: 20px; font-weight: 500; letter-spacing: 0.38em; text-transform: uppercase; color: #ecdcb0; }
  .ui p  { margin-top: 7px; font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; color: #8499bd; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette"></div>
<div class="ui">
  <h1>Starlight Bottle</h1>
  <p>Doors &middot; Midnight Ocean &mdash; Drag to orbit &middot; Scroll to zoom</p>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   RENDERER / SCENE / CAMERA
============================================================ */
const DPR = Math.min(window.devicePixelRatio, 2);
const canvas = document.getElementById('scene');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(DPR);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x030814, 0.02);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 600);
camera.position.set(3.6, 2.7, 4.8);

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 1.55, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 3.0;
controls.maxDistance = 12.0;
controls.maxPolarAngle = Math.PI * 0.52;
controls.enablePan = false;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;

/* ============================================================
   PROCEDURAL NOISE (tileable Perlin -> ocean normal map)
============================================================ */
function makePerlin(seed = 1) {
  let s = (seed >>> 0) || 1;
  const rand = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const perm = Array.from({ length: 256 }, (_, i) => i);
  for (let i = 255; i > 0; i--) { const j = (rand() * (i + 1)) | 0; [perm[i], perm[j]] = [perm[j], perm[i]]; }
  const p = new Uint8Array(512);
  for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
  const grads = Array.from({ length: 256 }, () => { const a = rand() * Math.PI * 2; return [Math.cos(a), Math.sin(a)]; });
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
  const lerp = (a, b, t) => a + (b - a) * t;
  return function noise(x, y, period) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const X = ((xi % period) + period) % period, Y = ((yi % period) + period) % period;
    const X1 = (X + 1) % period, Y1 = (Y + 1) % period;
    const g00 = grads[p[p[X] + Y]], g10 = grads[p[p[X1] + Y]];
    const g01 = grads[p[p[X] + Y1]], g11 = grads[p[p[X1] + Y1]];
    const d00 = g00[0] * xf + g00[1] * yf,       d10 = g10[0] * (xf - 1) + g10[1] * yf;
    const d01 = g01[0] * xf + g01[1] * (yf - 1), d11 = g11[0] * (xf - 1) + g11[1] * (yf - 1);
    const u = fade(xf), v = fade(yf);
    return lerp(lerp(d00, d10, u), lerp(d01, d11, u), v);
  };
}
function fbm(noise, x, y, period, octaves) {
  let amp = 1, sum = 0, norm = 0, per = period;
  for (let o = 0; o < octaves; o++) { sum += amp * noise(x * per, y * per, per); norm += amp; amp *= 0.5; per *= 2; }
  return sum / norm;
}
function makeWaterNormalTexture(size = 512) {
  const noise = makePerlin(11);
  const h = new Float32Array(size * size);
  for (let y = 0; y < size; y++)
    for (let x = 0; x < size; x++)
      h[y * size + x] = fbm(noise, x / size, y / size, 6, 4);

  const c = document.createElement('canvas'); c.width = c.height = size;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(size, size);
  const strength = 2.1;
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const xm = (x - 1 + size) % size, xp = (x + 1) % size;
      const ym = (y - 1 + size) % size, yp = (y + 1) % size;
      const nx = -(h[y * size + xp] - h[y * size + xm]) * strength;
      const ny = -(h[yp * size + x] - h[ym * size + x]) * strength;
      const il = 1 / Math.hypot(nx, ny, 1);
      const i = (y * size + x) * 4;
      img.data[i]     = (nx * il * 0.5 + 0.5) * 255;
      img.data[i + 1] = (ny * il * 0.5 + 0.5) * 255;
      img.data[i + 2] = (il * 0.5 + 0.5) * 255;
      img.data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(48, 48);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}
function makeWoodTexture() {
  const size = 256;
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  g.fillStyle = '#2e1c10'; g.fillRect(0, 0, size, size);
  for (let i = 0; i < 80; i++) {
    const dark = Math.random() < 0.6;
    g.strokeStyle = dark ? `rgba(18,9,4,${0.08 + Math.random() * 0.14})`
                         : `rgba(122,82,48,${0.05 + Math.random() * 0.10})`;
    g.lineWidth = 0.6 + Math.random() * 2.2;
    const x0 = Math.random() * size, ph = Math.random() * Math.PI * 2, f = 0.02 + Math.random() * 0.05;
    g.beginPath(); g.moveTo(x0, -8);
    for (let y = -8; y <= size + 8; y += 10) g.lineTo(x0 + Math.sin(y * f + ph) * 5, y);
    g.stroke();
  }
  for (let i = 0; i < 500; i++) {
    g.fillStyle = `rgba(0,0,0,${Math.random() * 0.12})`;
    g.fillRect(Math.random() * size, Math.random() * size, 1.5, 1.5);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
function makeSkyTexture() {
  const w = 1024, h = 512;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0.00, '#040918');
  gr.addColorStop(0.42, '#060d20');
  gr.addColorStop(0.50, '#0a1526');
  gr.addColorStop(0.55, '#050b18');
  gr.addColorStop(1.00, '#01030a');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 500; i++) {
    const y = Math.random() * h * 0.5;
    const a = Math.max((1 - y / (h * 0.6)) * (0.15 + Math.random() * 0.5), 0.05);
    g.fillStyle = `rgba(255,255,255,${a})`;
    const s = Math.random() < 0.92 ? 1 : 2;
    g.fillRect(Math.random() * w, y, s, s);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
function makeGlowTexture(stops, size = 256) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  stops.forEach(([o, col]) => gr.addColorStop(o, col));
  g.fillStyle = gr; g.fillRect(0, 0, size, size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* ============================================================
   SKY, ENVIRONMENT, STARS, MOON
============================================================ */
const skyTex = makeSkyTexture();
scene.background = skyTex;
scene.backgroundIntensity = 0.9;
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromEquirectangular(skyTex).texture;
pmrem.dispose();

// Twinkling pinprick starfield
const STAR_COUNT = 1600;
const starPos = new Float32Array(STAR_COUNT * 3);
const starScale = new Float32Array(STAR_COUNT);
const starPhase = new Float32Array(STAR_COUNT);
const starTint = new Float32Array(STAR_COUNT * 3);
const cool = new THREE.Color(0xcfdcff), warm = new THREE.Color(0xffe9c4), tmpC = new THREE.Color();
for (let i = 0; i < STAR_COUNT; i++) {
  const theta = Math.random() * Math.PI * 2;
  const elev = Math.pow(Math.random(), 0.65) * (Math.PI / 2 - 0.05) + 0.02;
  const r = 150;
  starPos[i * 3]     = Math.cos(theta) * Math.cos(elev) * r;
  starPos[i * 3 + 1] = Math.sin(elev) * r;
  starPos[i * 3 + 2] = Math.sin(theta) * Math.cos(elev) * r;
  starScale[i] = 0.7 + Math.pow(Math.random(), 2.4) * 2.1;
  starPhase[i] = Math.random() * Math.PI * 2;
  tmpC.lerpColors(cool, warm, Math.random()).multiplyScalar(0.6 + Math.random() * 0.6);
  starTint[i * 3] = tmpC.r; starTint[i * 3 + 1] = tmpC.g; starTint[i * 3 + 2] = tmpC.b;
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
starGeo.setAttribute('aScale', new THREE.BufferAttribute(starScale, 1));
starGeo.setAttribute('aPhase', new THREE.BufferAttribute(starPhase, 1));
starGeo.setAttribute('aTint', new THREE.BufferAttribute(starTint, 3));
const starMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uPixelRatio: { value: DPR } },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime; uniform float uPixelRatio;
    attribute float aScale; attribute float aPhase; attribute vec3 aTint;
    varying vec3 vTint; varying float vTw;
    void main() {
      vTint = aTint;
      vTw = 0.55 + 0.45 * sin(uTime * 1.6 + aPhase);
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = aScale * uPixelRatio * (160.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying vec3 vTint; varying float vTw;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      float a = pow(smoothstep(0.5, 0.05, d), 1.8);
      gl_FragColor = vec4(vTint * (0.7 + 0.6 * vTw), a * vTw);
    }`
});
scene.add(new THREE.Points(starGeo, starMat));

// Moon glow sprites (backlights the bottle)
const moonDir = new THREE.Vector3(-0.45, 0.5, -0.65).normalize().multiplyScalar(130);
const moonCore = new THREE.Sprite(new THREE.SpriteMaterial({
  map: makeGlowTexture([[0, 'rgba(235,242,255,1)'], [0.25, 'rgba(210,225,255,0.9)'], [0.6, 'rgba(160,190,255,0.22)'], [1, 'rgba(120,160,255,0)']]),
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false, opacity: 0.95
}));
moonCore.position.copy(moonDir); moonCore.scale.setScalar(14);
const moonHalo = new THREE.Sprite(new THREE.SpriteMaterial({
  map: makeGlowTexture([[0, 'rgba(150,180,255,0.32)'], [1, 'rgba(150,180,255,0)']]),
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false, opacity: 0.55
}));
moonHalo.position.copy(moonDir); moonHalo.scale.setScalar(48);
scene.add(moonCore, moonHalo);

/* ============================================================
   OCEAN
============================================================ */
const waterNormalTex = makeWaterNormalTexture(512);
const waterMat = new THREE.MeshPhysicalMaterial({
  color: 0x030814,
  roughness: 0.12,
  metalness: 0.1,
  clearcoat: 1.0,
  clearcoatRoughness: 0.1,
  normalMap: waterNormalTex,
  normalScale: new THREE.Vector2(0.5, 0.5),
  envMapIntensity: 1.25
});
const water = new THREE.Mesh(new THREE.PlaneGeometry(320, 320, 96, 96), waterMat);
water.rotation.x = -Math.PI / 2;
water.receiveShadow = true;
scene.add(water);

/* ============================================================
   STARLIGHT BOTTLE  (modular hierarchy)
============================================================ */
const woodTex = makeWoodTexture();
const woodMat  = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.85, metalness: 0.0 });
const goldMat  = new THREE.MeshStandardMaterial({ color: 0xEAD58A, metalness: 0.8, roughness: 0.3, envMapIntensity: 1.4 });
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff, transmission: 0.9, roughness: 0.08, ior: 1.45,
  thickness: 0.12, transparent: true, clearcoat: 0.5, clearcoatRoughness: 0.12,
  attenuationColor: new THREE.Color(0xffe2b0), attenuationDistance: 1.2, envMapIntensity: 1.0
});
const glassTubeMat = glassMat.clone();
glassTubeMat.side = THREE.DoubleSide;
const crestMat = new THREE.MeshStandardMaterial({
  color: 0xFFF59D, emissive: 0xFFE082, emissiveIntensity: 0.35, roughness: 0.4, metalness: 0.0
});

// Velvety mango-nectar liquid shader (opaque -> visible through transmissive glass)
const liquidMat = new THREE.ShaderMaterial({
  uniforms: {
    uTop:  { value: new THREE.Color(0xFFF066) },
    uMid:  { value: new THREE.Color(0xFF8C33) },
    uBase: { value: new THREE.Color(0xE65100) },
    uMinY: { value: -1.0 }, uMaxY: { value: 1.0 }, uTime: { value: 0 }
  },
  vertexShader: `
    varying vec3 vLocal; varying vec3 vNormalW; varying vec3 vWorldPos;
    void main() {
      vLocal = position;
      vNormalW = normalize(mat3(modelMatrix) * normal);
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPos = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: `
    uniform vec3 uTop; uniform vec3 uMid; uniform vec3 uBase;
    uniform float uMinY; uniform float uMaxY; uniform float uTime;
    varying vec3 vLocal; varying vec3 vNormalW; varying vec3 vWorldPos;
    float hash13(vec3 p) {
      p = fract(p * 0.1031);
      p += dot(p, p.zyx + 31.32);
      return fract((p.x + p.y) * p.z);
    }
    void main() {
      float h = clamp((vLocal.y - uMinY) / (uMaxY - uMinY), 0.0, 1.0);
      vec3 col = mix(uBase, uMid, smoothstep(0.02, 0.55, h));
      col = mix(col, uTop, smoothstep(0.55, 0.98, h));
      // fine velvety starlight-pulp stipple (gently shimmering)
      float g1 = hash13(floor(vLocal * 70.0));
      float g2 = hash13(floor(vLocal * 38.0) + floor(uTime * 2.5) * 11.7);
      col *= 1.0 + (g1 - 0.5) * 0.10 + (g2 - 0.5) * 0.06;
      col *= 1.0 + 0.04 * sin(vLocal.y * 9.0 + uTime * 0.7 + sin(vLocal.x * 5.0));
      // soft fresnel volume falloff (SSS-style soft edges, no neon)
      vec3 V = normalize(cameraPosition - vWorldPos);
      float fr = pow(1.0 - abs(dot(normalize(vNormalW), V)), 2.5);
      col *= 1.0 - fr * 0.35;
      col += uTop * fr * 0.10;
      col *= 1.12; // mild HDR lift so bloom only kisses the brightest pulp
      gl_FragColor = vec4(col, 1.0);
    }`
});

function roundedRectShape(w, h, r) {
  const s = new THREE.Shape(); const x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y);
  s.absarc(x + w - r, y + r, r, -Math.PI / 2, 0);
  s.lineTo(x + w, y + h - r);
  s.absarc(x + w - r, y + h - r, r, 0, Math.PI / 2);
  s.lineTo(x + r, y + h);
  s.absarc(x + r, y + h - r, r, Math.PI / 2, Math.PI);
  s.lineTo(x, y + r);
  s.absarc(x + r, y + r, r, Math.PI, Math.PI * 1.5);
  return s;
}
function fourPointStarShape(Rh, Rv, r) {
  const pts = [[0, Rv], [r, r], [Rh, 0], [r, -r], [0, -Rv], [-r, -r], [-Rh, 0], [-r, r]];
  const s = new THREE.Shape();
  s.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) s.lineTo(pts[i][0], pts[i][1]);
  s.closePath();
  return s;
}

const bottle = new THREE.Group();
scene.add(bottle);

// --- Bottom coaster: dark-wood disc + inset pale-gold rim ring
const coaster = new THREE.Mesh(new THREE.CylinderGeometry(1.05, 1.14, 0.14, 48), woodMat);
coaster.position.y = 0.07;
coaster.castShadow = true;
const coasterRing = new THREE.Mesh(new THREE.TorusGeometry(1.09, 0.028, 12, 72), goldMat);
coasterRing.rotation.x = Math.PI / 2;
coasterRing.position.y = 0.075;
bottle.add(coaster, coasterRing);

// --- Main flask body (flattened rounded apothecary form)
const bodyGeo = new THREE.ExtrudeGeometry(roundedRectShape(1.7, 2.1, 0.34), {
  depth: 0.5, steps: 1, bevelEnabled: true, bevelThickness: 0.09, bevelSize: 0.09, bevelSegments: 5, curveSegments: 24
});
bodyGeo.translate(0, 0, -0.25);
const bodyGlass = new THREE.Mesh(bodyGeo, glassMat);
bodyGlass.position.y = 1.19;
bottle.add(bodyGlass);

// --- Liquid nectar interior
const liquidGeo = new THREE.ExtrudeGeometry(roundedRectShape(1.5, 1.86, 0.28), {
  depth: 0.42, steps: 1, bevelEnabled: true, bevelThickness: 0.08, bevelSize: 0.08, bevelSegments: 4, curveSegments: 20
});
liquidGeo.translate(0, 0, -0.21);
const liquid = new THREE.Mesh(liquidGeo, liquidMat);
liquid.position.y = 1.12;
liquid.castShadow = true;
bottle.add(liquid);

// --- Asymmetrical swan-neck (glass tube + partial nectar rise)
const neckPts = [
  new THREE.Vector3(0.00, 2.02, 0), new THREE.Vector3(0.10, 2.20, 0),
  new THREE.Vector3(0.24, 2.42, 0), new THREE.Vector3(0.27, 2.66, 0),
  new THREE.Vector3(0.17, 2.90, 0), new THREE.Vector3(0.03, 3.06, 0),
  new THREE.Vector3(0.00, 3.22, 0)
];
const neckCurve = new THREE.CatmullRomCurve3(neckPts);
const neckGlass = new THREE.Mesh(new THREE.TubeGeometry(neckCurve, 64, 0.155, 24, false), glassTubeMat);
const neckLiquid = new THREE.Mesh(
  new THREE.TubeGeometry(new THREE.CatmullRomCurve3(neckPts.slice(0, 5)), 48, 0.10, 16, false), liquidMat
);
const neckLip = new THREE.Mesh(new THREE.TorusGeometry(0.165, 0.035, 12, 32), glassTubeMat);
neckLip.rotation.x = Math.PI / 2;
neckLip.position.y = 3.22;
bottle.add(neckGlass, neckLiquid, neckLip);

// --- Tiered cork stopper + gold band
const cork1 = new THREE.Mesh(new THREE.CylinderGeometry(0.145, 0.16, 0.14, 24), woodMat);
cork1.position.y = 3.26;
const cork2 = new THREE.Mesh(new THREE.CylinderGeometry(0.21, 0.21, 0.13, 24), woodMat);
cork2.position.y = 3.375;
const cork3 = new THREE.Mesh(new THREE.CylinderGeometry(0.185, 0.21, 0.07, 24), woodMat);
cork3.position.y = 3.475;
const corkBand = new THREE.Mesh(new THREE.TorusGeometry(0.215, 0.026, 12, 48), goldMat);
corkBand.rotation.x = Math.PI / 2;
corkBand.position.y = 3.375;
[cork1, cork2, cork3].forEach(m => (m.castShadow = true));
bottle.add(cork1, cork2, cork3, corkBand);

// --- Extruded 4-point star sigil on the front face
const starSigilGeo = new THREE.ExtrudeGeometry(fourPointStarShape(0.40, 0.54, 0.105), {
  depth: 0.05, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.028, bevelSegments: 2
});
const starSigil = new THREE.Mesh(starSigilGeo, crestMat);
starSigil.position.set(0, 1.24, 0.345);
starSigil.castShadow = true;
bottle.add(starSigil);

// --- 14 floating butter-yellow shards (tetrahedra + stretched octahedral diamonds)
const shards = [];
const tetraGeo = new THREE.TetrahedronGeometry(0.085);
const diamondGeo = new THREE.OctahedronGeometry(0.07);
diamondGeo.scale(1, 1.7, 1);
for (let i = 0; i < 14; i++) {
  const mesh = new THREE.Mesh(i % 2 === 0 ? tetraGeo : diamondGeo, crestMat);
  mesh.castShadow = true;
  shards.push({
    mesh,
    radius: 1.25 + Math.random() * 0.95,
    height: 0.55 + Math.random() * 2.6,
    speed: (0.12 + Math.random() * 0.3) * (Math.random() < 0.5 ? -1 : 1),
    phase: Math.random() * Math.PI * 2,
    bobAmp: 0.08 + Math.random() * 0.12,
    bobSpeed: 0.6 + Math.random() * 0.8,
    rot: new THREE.Vector3((Math.random() - 0.5) * 1.4, (Math.random() - 0.5) * 1.4, (Math.random() - 0.5) * 1.4)
  });
  bottle.add(mesh);
}

/* ============================================================
   LIGHTING (cool moon rim + warm inner core for soft SSS feel)
============================================================ */
const moonLight = new THREE.DirectionalLight(0x8fb4ff, 1.35);
moonLight.position.set(-7, 9, -6);
moonLight.castShadow = true;
moonLight.shadow.mapSize.set(1024, 1024);
moonLight.shadow.camera.left = -4; moonLight.shadow.camera.right = 4;
moonLight.shadow.camera.top = 6;   moonLight.shadow.camera.bottom = -2;
moonLight.shadow.camera.near = 2;  moonLight.shadow.camera.far = 25;
moonLight.shadow.bias = -0.0006;
scene.add(moonLight, moonLight.target);

scene.add(new THREE.HemisphereLight(0x1c2b47, 0x04060a, 0.5));

const coreLight = new THREE.PointLight(0xFFAA33, 1.5, 3.5);
coreLight.position.set(0, 1.15, 0);
bottle.add(coreLight);

/* ============================================================
   POST-PROCESSING (strictly controlled bloom)
============================================================ */
const rt = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.setPixelRatio(DPR);
composer.setSize(window.innerWidth, window.innerHeight);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.45,  // strength: soft ethereal glow
  0.6,   // radius
  0.82   // threshold: keeps bottle & sigil crisp, no white flare
);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

/* ============================================================
   ANIMATION LOOP
============================================================ */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // Gentle ocean bobbing
  bottle.position.y = 0.05 + Math.sin(t * 0.72) * 0.06 + Math.sin(t * 1.31) * 0.02;
  bottle.rotation.z = Math.sin(t * 0.50) * 0.028;
  bottle.rotation.x = Math.sin(t * 0.63 + 1.2) * 0.022;
  bottle.rotation.y = Math.sin(t * 0.21) * 0.05;

  // Orbiting, self-tumbling shards
  for (const s of shards) {
    const a = s.phase + t * s.speed;
    s.mesh.position.set(
      Math.cos(a) * s.radius,
      s.height + Math.sin(t * s.bobSpeed + s.phase) * s.bobAmp,
      Math.sin(a) * s.radius
    );
    s.mesh.rotation.set(t * s.rot.x, t * s.rot.y, t * s.rot.z);
  }

  // Drifting ocean ripple normal map (GPU-side, no CPU vertex loops)
  waterNormalTex.offset.x = (t * 0.0055) % 1;
  waterNormalTex.offset.y = (t * 0.0038) % 1;

  // Liquid pulp shimmer, star twinkle, warm core breathing
  liquidMat.uniforms.uTime.value = t;
  starMat.uniforms.uTime.value = t;
  coreLight.intensity = 1.5 + Math.sin(t * 2.1) * 0.12 + Math.sin(t * 5.7) * 0.05;

  controls.update();
  composer.render();
}
animate();

/* ============================================================
   RESIZE
============================================================ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
